<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src blob:"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPA Viewer</title>
<style>
:root{color-scheme:light dark;font:13px -apple-system,BlinkMacSystemFont,sans-serif}*{box-sizing:border-box}body{margin:0;display:flex;height:100vh}main{flex:1;min-width:0;position:relative;background:#383d43}canvas{display:block;width:100%;height:100%}aside{width:230px;padding:12px;overflow:auto}fieldset{border:0;border-bottom:1px solid #8885;padding:8px 0 14px;margin:0 0 12px}legend{font-weight:600}label,select,button{margin:3px 0}select{max-width:100%}button,input,select{font:inherit}input[type=number]{width:58px}output{display:block;margin:6px 0}#status{position:absolute;left:12px;bottom:8px;color:white;background:#24272be8;padding:4px 7px;border-radius:4px;max-width:92%;pointer-events:none}[hidden]{display:none!important}
</style></head><body><main><canvas id="viewport"></canvas><output id="status" role="status">Open a 3D model to begin.</output></main>
<aside hidden id="panel"><fieldset><legend>Display</legend><select id="display"><option>Texture</option><option>Solid</option><option>Wireframe</option><option>Texture + wireframe</option></select><output id="calibration"></output></fieldset>
<fieldset><legend>Interaction</legend><select id="tool"><option>Orbit camera</option><option>Measure distance</option><option>Calibrate</option><option>Rotate model</option></select><p id="hint"></p><div id="reference" hidden><label>Reference <input type="number" id="length" min="0" step="any"> cm</label><button id="add">Add reference</button><output id="count"></output><button id="apply">Apply calibration</button></div></fieldset>
<fieldset><legend>Model rotation (°)</legend><div id="axes"></div><button id="undo">Undo edit</button></fieldset>
<fieldset><legend>Save model</legend><select id="format"></select> <button id="save">Save as…</button></fieldset>
<fieldset><legend>Scientific illustration</legend><select id="doc"><option>Orthographic view</option><option>Multiview plate</option><option>Cross section</option><option>Silhouette</option><option>Profile</option></select><select id="direction"><option>Front</option><option>Side</option><option>Top</option></select><label id="sliceLabel" hidden>Section position <input type="range" id="slice" value="50" min="1" max="99"></label><label><input type="checkbox" id="bar" checked> Scale bar (cm)</label><button id="illustrate">Export PNG…</button></fieldset></aside>
<script src="viewer.js"></script></body></html>
